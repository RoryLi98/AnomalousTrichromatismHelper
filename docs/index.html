<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0E1116">
  <meta name="description" content="色觉助手：实时识别颜色、分割色块，并为色弱/色盲用户实时矫正视频颜色。Color Vision Helper: name colors, outline color regions and correct colors live for color-vision deficiency.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="色觉助手">
  <title>色觉助手</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4.5 10A8 8 0 0 1 18 6.5M19.5 14A8 8 0 0 1 6 17.5"/><path d="M18.5 2.5v4.2h-4.2M5.5 21.5v-4.2h4.2"/></symbol>
      <symbol id="i-torch" viewBox="0 0 24 24"><path d="M7 3h10v3l-3 4v11h-4V10L7 6z"/><path d="M12 13v2"/></symbol>
      <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="18" r="2.5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8h3.5l2-3h6l2 3h3.5v11h-17z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-test" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v4M12 16.5v4"/><circle cx="8.5" cy="10" r="1.2"/><circle cx="15" cy="9" r="1.2"/><circle cx="10" cy="15" r="1.2"/><circle cx="15.5" cy="14.5" r="1.2"/></symbol>
      <symbol id="i-lens" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 3.5v4.5M20.5 12H16M12 20.5V16M3.5 12H8"/></symbol>
      <symbol id="i-wb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-reg-big" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="3 2.2"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-reg-small" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" stroke-dasharray="2.2 1.8"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
      <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="1.5"/><path d="M8.5 20h7M12 16.5V20"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.6-1.6-1.8-1.6-3.2 0-1 .8-1.8 1.9-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.3"/><circle cx="10" cy="7" r="1.3"/><circle cx="15" cy="7" r="1.3"/></symbol>
    </defs>
  </svg>

  <main id="app" class="mode-identify">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="view" aria-label="camera view"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div id="frame" aria-hidden="true"></div>
    <div id="reticle" aria-hidden="true"><span id="retShape"></span><span class="ring"></span><span class="tip" data-i18n="wb.aim"></span></div>
    <div id="splitLabels" hidden><span data-i18n="cvd.split.left"></span><span data-i18n="cvd.split.right"></span></div>

    <header class="topbar">
      <div class="top-left">
      <div class="seg scene-switch" role="tablist" data-i18n-aria="scene.aria">
        <button id="sceneReal" role="tab" aria-selected="true"><svg class="ic"><use href="#i-sun"/></svg><span data-i18n="scene.real"></span></button>
        <button id="sceneScreen" role="tab" aria-selected="false"><svg class="ic"><use href="#i-screen"/></svg><span data-i18n="scene.screen"></span></button>
      </div>
      <div class="seg mode-switch" role="tablist">
        <button id="modeIdentify" role="tab" aria-selected="true"><svg class="ic"><use href="#i-palette"/></svg><span data-i18n="mode.identify"></span></button>
        <button id="modeCorrect" role="tab" aria-selected="false"><svg class="ic"><use href="#i-eye"/></svg><span data-i18n="mode.correct"></span></button>
      </div>
      </div>
      <div class="top-actions">
        <button id="btnLang" class="chip-btn lang-top"><svg class="ic"><use href="#i-globe"/></svg><span data-i18n="tool.lang"></span></button>
        <button id="btnSettings" class="icon-btn" data-i18n-aria="tool.settings"><svg class="ic"><use href="#i-sliders"/></svg></button>
      </div>
    </header>

    <button id="btnRecenter" class="float-btn" hidden data-i18n-aria="tool.recenter"><svg class="ic"><use href="#i-target"/></svg><span data-i18n="tool.recenter"></span></button>
    <div id="hud" hidden></div>
    <div id="zoomChips" class="zoom-chips" hidden></div>
    <div id="rangeCtl" class="range-ctl" hidden>
      <button class="rc-btn" id="rangePlus" data-i18n-aria="range.more"><svg class="ic"><use href="#i-reg-big"/></svg><span data-i18n="range.big"></span></button>
      <div class="rc-track" id="rangeTrack" role="slider" data-i18n-aria="range.aria"><div class="rc-fill" id="rangeFill"></div><div class="rc-knob" id="rangeKnob"></div></div>
      <button class="rc-btn" id="rangeMinus" data-i18n-aria="range.less"><span data-i18n="range.small"></span><svg class="ic"><use href="#i-reg-small"/></svg></button>
    </div>

    <section class="bottom">
      <section id="correctPanel" class="panel" aria-label="correction">
        <div class="cp-head">
          <button id="cpToggle" class="cp-sum" aria-expanded="true">
            <span id="cpSummary"></span>
            <svg class="ic chev"><use href="#i-chevron"/></svg>
          </button>
          <button id="btnCpInfo" class="icon-btn sm" data-i18n-aria="info.open"><svg class="ic"><use href="#i-info"/></svg></button>
          <button id="btnTest" class="chip-btn small"><svg class="ic"><use href="#i-test"/></svg><span data-i18n="cvd.test"></span></button>
        </div>
        <div class="cp-body">
          <div class="seg seg-wide" id="typeSeg" role="tablist">
            <button data-type="protan"><b data-i18n="cvd.protan"></b><small data-i18n="cvd.protan.sub"></small></button>
            <button data-type="deutan"><b data-i18n="cvd.deutan"></b><small data-i18n="cvd.deutan.sub"></small></button>
            <button data-type="tritan"><b data-i18n="cvd.tritan"></b><small data-i18n="cvd.tritan.sub"></small></button>
          </div>
          <div class="row-inline">
            <div class="label"><span data-i18n="cvd.severity"></span><output id="sevOut"></output></div>
            <input type="range" id="severity" min="0" max="100" step="5" value="60">
          </div>
          <div>
            <div class="chips" id="methodChips">
              <button data-method="auto" data-i18n="m.auto"></button>
              <button data-method="balanced" data-i18n="m.balanced"></button>
              <button data-method="compensate" data-i18n="m.compensate"></button>
              <button data-method="enhance" data-i18n="m.enhance"></button>
              <button data-method="simulate" data-i18n="m.simulate"></button>
            </div>
            <p class="desc" id="methodDesc"></p>
          </div>
          <div class="row-inline">
            <div class="label"><span data-i18n="cvd.strength"></span><output id="strOut"></output></div>
            <input type="range" id="strength" min="0" max="200" step="5" value="100">
          </div>
          <div class="toggles">
            <label class="tog"><input type="checkbox" id="optSplit"><span data-i18n="cvd.split"></span></label>
            <label class="tog"><input type="checkbox" id="optPreview"><span data-i18n="cvd.preview"></span></label>
          </div>
        </div>
      </section>

      <section id="wbPop" class="panel pop" hidden aria-label="light and true color">
        <div class="pop-head">
          <b id="lightTitle" data-i18n="light.title"></b>
          <button id="wbClose" class="icon-btn sm" data-i18n-aria="settings.close"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
        <div id="wbBox" class="pop-box">
          <div class="pop-label" data-i18n="wb.title"></div>
          <div class="seg seg-wide" id="wbSeg">
            <button data-wb="auto"><b data-i18n="wb.auto"></b></button>
            <button data-wb="manual"><b data-i18n="wb.manual"></b></button>
            <button data-wb="off"><b data-i18n="wb.off"></b></button>
          </div>
          <p class="desc" id="wbDesc"></p>
          <button id="btnWBCal" class="primary cal-btn"><svg class="ic"><use href="#i-target"/></svg><span data-i18n="wb.calibrate"></span></button>
        </div>
        <div id="tcBox" class="pop-box" hidden>
          <div class="pop-label" data-i18n="tc.srcLabel"></div>
          <div class="chips tc-src" id="tcSrc">
            <button data-src="auto" data-i18n="tc.src.auto"></button>
            <button data-src="camera" data-i18n="tc.src.camera"></button>
            <button data-src="paper" data-i18n="tc.src.paper"></button>
            <button data-src="torch" data-i18n="tc.src.torch"></button>
            <button data-src="chart" data-i18n="tc.src.chart"></button>
          </div>
          <p class="desc" id="tcDesc"></p>
          <div id="tcPaperRow" class="pop-box">
            <div class="row-inline">
              <div class="label" data-i18n="tc.rhoLabel"></div>
              <div class="seg seg-wide" id="tcRho">
                <button data-rho="0.85" data-i18n="tc.rho.white"></button>
                <button data-rho="0.18" data-i18n="tc.rho.gray"></button>
              </div>
            </div>
            <div class="btn-row">
              <button id="btnPickPaper" class="secondary small" data-i18n="tc.btn.pickPaper"></button>
              <button id="btnPaperAuto" class="secondary small" data-i18n="tc.btn.paperAuto" hidden></button>
            </div>
          </div>
          <div class="btn-row" id="tcTorchRow">
            <button id="btnTorchMeasure" class="primary small-btn" data-i18n="tc.btn.measure"></button>
            <button id="btnTorchCal" class="secondary small" data-i18n="tc.btn.cal"></button>
          </div>
          <button id="btnTorchRecheck" class="wide-btn" data-i18n="tc.btn.recheck" hidden></button>
          <div id="tcChartRow" class="pop-box">
            <div class="seg seg-wide" id="tcChart">
              <button data-chart="cc24"><b data-i18n="tc.chart.cc24"></b><small data-i18n="tc.chart.cc24.sub"></small></button>
              <button data-chart="print14"><b data-i18n="tc.chart.print"></b><small data-i18n="tc.chart.print.sub"></small></button>
            </div>
            <div class="btn-row">
              <button id="btnPickChart" class="primary small-btn" data-i18n="tc.btn.pick"></button>
              <button id="btnPrintCard" class="secondary small" data-i18n="tc.btn.print"></button>
            </div>
            <button id="btnPrintCal" class="wide-btn" data-i18n="tc.btn.printCal"></button>
          </div>
          <details id="tcMore" class="pop-more">
            <summary data-i18n="tc.more"></summary>
            <div class="pop-box">
              <label class="tog"><input type="checkbox" id="optTcPreview"><span data-i18n="tc.opt.preview"></span></label>
              <label class="tog"><input type="checkbox" id="optTcDefSat"><span data-i18n="tc.opt.defSat"></span></label>
              <div class="btn-row">
                <button id="btnValidate" class="secondary small" data-i18n="tc.btn.validate"></button>
                <button id="btnValidateLog" class="secondary small" data-i18n="tc.btn.validateLog"></button>
              </div>
              <button id="btnTCReset" class="wide-btn" data-i18n="tc.btn.resetCal" hidden></button>
              <a class="desc tc-probe" href="lab/camera-probe.html" target="_blank" rel="noopener" data-i18n="tc.probe"></a>
            </div>
          </details>
        </div>
      </section>

      <!-- one strip for hints (closable, remembered) and for steps that need the user (always shown) -->
      <section id="hint" class="hint" hidden aria-live="polite">
        <button id="hintText" class="hint-text" data-i18n-aria="info.open"><svg class="ic"><use href="#i-info"/></svg><span id="hintLine"></span></button>
        <span id="hintActions" class="hint-actions"></span>
        <button id="hintClose" class="hint-close" data-i18n-aria="hint.close"><svg class="ic"><use href="#i-close"/></svg></button>
      </section>

      <section id="card" class="panel" aria-live="polite">
        <div class="card-main">
          <div id="swatch"></div>
          <div class="card-text">
            <div id="colorName" class="name" data-i18n="card.waiting"></div>
            <div id="colorAlt" class="alt"></div>
            <div id="colorSub" class="sub"></div>
          </div>
          <button id="btnSpeak" class="icon-btn" data-i18n-aria="tool.speak"><svg class="ic"><use href="#i-speak"/></svg></button>
        </div>
        <div id="colorMsgs" class="msgs"></div>
        <div class="card-foot">
          <div id="colorStatus" class="status"></div>
          <div class="name-set" role="group" aria-labelledby="setLbl">
            <span id="setLbl" class="name-set-lbl" data-i18n="set.label"></span>
            <div class="seg seg-mini" id="setSeg">
              <button data-set="basic" data-i18n="set.basic"></button>
              <button data-set="detailed" data-i18n="set.detailed"></button>
            </div>
          </div>
        </div>
      </section>

      <nav class="toolbar">
        <button id="btnFreeze"><svg class="ic"><use href="#i-pause"/></svg><span data-i18n="tool.freeze"></span></button>
        <button id="btnPhoto"><svg class="ic"><use href="#i-image"/></svg><span data-i18n="tool.photo"></span></button>
        <button id="btnLens"><svg class="ic"><use href="#i-lens"/></svg><span data-i18n="tool.lens"></span></button>
        <button id="btnWBTool"><svg class="ic"><use href="#i-wb"/></svg><span data-i18n="tool.wb"></span><i class="badge" id="wbBadge"></i></button>
        <button id="btnTorch" disabled><svg class="ic"><use href="#i-torch"/></svg><span data-i18n="tool.torch"></span></button>
      </nav>
    </section>

    <!-- start / permission screen -->
    <section id="start" class="sheet-full">
      <div class="start-inner">
        <img src="icons/icon-192.png" alt="" width="88" height="88" class="logo">
        <h1 data-i18n="app.title"></h1>
        <p class="tagline" data-i18n="start.tagline"></p>
        <p id="startError" class="error" hidden></p>
        <button id="btnStart" class="primary"><svg class="ic"><use href="#i-camera"/></svg><span data-i18n="start.camera"></span></button>
        <button id="btnStartPhoto" class="secondary"><svg class="ic"><use href="#i-image"/></svg><span data-i18n="start.photo"></span></button>
        <button id="btnStartLang" class="link"><svg class="ic"><use href="#i-globe"/></svg><span data-i18n="tool.lang"></span></button>
        <p class="note" data-i18n="start.note"></p>
      </div>
    </section>

    <!-- settings -->
    <section id="settings" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="settingsTitle" data-i18n="settings.title"></h2>
          <button id="btnSettingsClose" class="chip-btn" data-i18n="settings.close"></button>
        </div>
        <div class="sgroup" data-i18n="settings.groupId"></div>
        <div class="srow">
          <div class="label" data-i18n="settings.reticle"></div>
          <div class="ret-pick" id="retStyle"></div>
          <div class="seg seg-wide ret-size" id="retSize">
            <button data-size="s" data-i18n="settings.retSize.s"></button>
            <button data-size="m" data-i18n="settings.retSize.m"></button>
            <button data-size="l" data-i18n="settings.retSize.l"></button>
          </div>
        </div>
        <label class="tog srow"><input type="checkbox" id="optBilingual"><span data-i18n="settings.bilingual"></span></label>
        <label class="tog srow"><input type="checkbox" id="optValues" checked><span data-i18n="settings.values"></span></label>
        <label class="tog srow"><input type="checkbox" id="optOutline" checked><span data-i18n="settings.outline"></span></label>
        <label class="tog srow"><input type="checkbox" id="optDim"><span data-i18n="settings.dim"></span></label>
        <label class="tog srow"><input type="checkbox" id="optAutoSpeak"><span data-i18n="settings.autospeak"></span></label>
        <div class="sgroup" data-i18n="settings.groupDisplay"></div>
        <div class="srow">
          <div class="label" data-i18n="settings.textSize"></div>
          <div class="seg seg-wide" id="textSizeSeg">
            <button data-size="m" data-i18n="settings.text.m"></button>
            <button data-size="l" data-i18n="settings.text.l"></button>
            <button data-size="xl" data-i18n="settings.text.xl"></button>
          </div>
        </div>
        <div class="srow srow-btn">
          <div><div class="srow-title" data-i18n="settings.lang"></div><div class="desc" data-i18n="settings.langDesc"></div></div>
          <button id="btnLangSet" class="chip-btn"><svg class="ic"><use href="#i-globe"/></svg><span data-i18n="tool.lang"></span></button>
        </div>
        <div class="srow srow-btn">
          <div><div class="srow-title" data-i18n="settings.hints"></div><div class="desc" data-i18n="settings.hintsDesc"></div></div>
          <button id="btnHintsReset" class="chip-btn" data-i18n="settings.hintsReset"></button>
        </div>
        <div class="sgroup" data-i18n="settings.groupApp"></div>
        <details class="srow fold">
          <summary data-i18n="settings.tips"></summary>
          <p class="desc" data-i18n="settings.tipsText"></p>
        </details>
        <div class="srow srow-btn">
          <div><div class="srow-title" data-i18n="settings.version"></div><div class="desc" id="appVersion"></div></div>
          <button id="btnUpdate" class="chip-btn" data-i18n="settings.update"></button>
        </div>
        <div class="srow srow-btn">
          <div><div class="srow-title" data-i18n="settings.resetTitle"></div><div class="desc" data-i18n="settings.resetDesc"></div></div>
          <button id="btnReset" class="chip-btn" data-i18n="settings.reset"></button>
        </div>
        <details class="srow fold">
          <summary data-i18n="settings.about"></summary>
          <p class="desc" data-i18n="about.text"></p>
          <p class="desc version"><a href="https://ruilin.li/AnomalousTrichromatismHelper/" target="_blank" rel="noopener">ruilin.li/AnomalousTrichromatismHelper</a></p>
        </details>
      </div>
    </section>

    <!-- camera / lens picker -->
    <section id="camSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="camTitle">
      <div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="camTitle" data-i18n="cam.title"></h2>
          <button id="btnCamClose" class="chip-btn" data-i18n="settings.close"></button>
        </div>
        <div class="srow">
          <div class="label" data-i18n="cam.choose"></div>
          <div id="camList" class="cam-list"></div>
          <p class="desc" id="camInfo"></p>
          <p class="desc cam-limits" id="camLimits" hidden></p>
        </div>
        <div class="srow">
          <div class="label" data-i18n="cam.frame"></div>
          <div class="seg seg-wide seg-tall" id="frameSeg">
            <button data-frame="fit"><b data-i18n="cam.fit"></b><small data-i18n="cam.fit.sub"></small></button>
            <button data-frame="fill"><b data-i18n="cam.fill"></b><small data-i18n="cam.fill.sub"></small></button>
          </div>
          <p class="desc" data-i18n="cam.hint"></p>
        </div>
      </div>
    </section>

    <!-- quick self-test -->
    <section id="test" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="testTitle">
      <div class="sheet-inner test-inner">
        <div class="sheet-head">
          <h2 id="testTitle" data-i18n="test.title"></h2>
          <button id="btnTestClose" class="icon-btn" data-i18n-aria="test.close"><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
        <div id="testIntro">
          <p class="desc" data-i18n="test.intro"></p>
          <button id="btnTestStart" class="primary" data-i18n="test.start"></button>
        </div>
        <div id="testRun" hidden>
          <p class="progress" id="testProgress"></p>
          <canvas id="testCanvas" width="600" height="600"></canvas>
          <div class="dir-pad">
            <button data-dir="0" class="d-up" data-i18n="dir.up"></button>
            <button data-dir="3" class="d-left" data-i18n="dir.left"></button>
            <button data-dir="-1" class="d-none" data-i18n="test.cantSee"></button>
            <button data-dir="1" class="d-right" data-i18n="dir.right"></button>
            <button data-dir="2" class="d-down" data-i18n="dir.down"></button>
          </div>
        </div>
        <div id="testResult" hidden>
          <h3 data-i18n="test.result"></h3>
          <p id="testResultText" class="result-text"></p>
          <p id="testVerify" class="verify-note" hidden></p>
          <div id="testBars"></div>
          <div class="btn-row">
            <button id="btnTestApply" class="primary" data-i18n="test.apply"></button>
            <button id="btnTestRetry" class="secondary" data-i18n="test.retry"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- how the current reading works, the numbers in use and what to adjust -->
    <section id="infoSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="infoTitle" data-i18n="info.title"></h2>
          <button id="btnInfoClose" class="chip-btn" data-i18n="settings.close"></button>
        </div>
        <p id="infoLine" class="info-line"></p>
        <div id="infoActions" class="info-actions"></div>
        <div id="infoBody" class="info-body"></div>
      </div>
    </section>

    <!-- what kind of picture was imported (true-colour scene only) -->
    <section id="photoAsk" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="photoAskTitle">
      <div class="sheet-inner">
        <h2 id="photoAskTitle" data-i18n="photo.ask"></h2>
        <p class="desc" data-i18n="photo.askDesc"></p>
        <button id="photoReal" class="primary ask-btn"><svg class="ic"><use href="#i-sun"/></svg><span><b data-i18n="photo.real"></b><small data-i18n="photo.real.sub"></small></span></button>
        <button id="photoScreen" class="secondary ask-btn"><svg class="ic"><use href="#i-screen"/></svg><span><b data-i18n="photo.screen"></b><small data-i18n="photo.screen.sub"></small></span></button>
      </div>
    </section>

    <!-- validation results (stored only on this phone) -->
    <section id="valSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="valTitle">
      <div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="valTitle" data-i18n="val.title"></h2>
          <button id="btnValClose" class="chip-btn" data-i18n="settings.close"></button>
        </div>
        <p class="desc" data-i18n="val.intro"></p>
        <div id="valBody"></div>
        <div class="btn-row">
          <button id="btnValExport" class="primary small-btn" data-i18n="val.export"></button>
          <button id="btnValClear" class="secondary small" data-i18n="val.clear"></button>
        </div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
